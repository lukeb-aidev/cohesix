# Author: Lukas Bower
# Purpose: Configure the Cohesix host-only REST gateway crate.
# Copyright 2026 Lukas Bower
[package]
name = "hive-gateway"
version = "0.1.0"
edition = "2021"
description = "Cohesix host-only REST gateway"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cohesix-net-constants = { workspace = true }
cohesix-ticket = { workspace = true }
cohesix-worker-evidence = { workspace = true }
cohsh = { path = "../cohsh", features = ["tcp"] }
cohsh-core = { workspace = true }
nine-door = { path = "../nine-door" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
