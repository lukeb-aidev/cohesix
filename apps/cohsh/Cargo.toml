# Author: Lukas Bower
# Purpose: Configure the Cohesix shell crate dependencies and metadata.
# Copyright 2026 Lukas Bower
[package]
name = "cohsh"
version = "0.1.0"
edition = "2021"
description = "Cohesix shell prototype using the live NineDoor Secure9P transport"
license = "MIT"

[[bin]]
name = "cohsh"
path = "src/main.rs"
test = false

[features]
default = ["tcp", "rest", "in-process", "gpu-bridge"]
# TCP transport pulls in `std` networking and is opt-in so offline workflows
# can build without socket dependencies.
tcp = []
rest = ["cohesix-rest"]
in-process = ["nine-door"]
gpu-bridge = ["gpu-bridge-host"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cohesix-ticket = { workspace = true }
cohsh-core = { workspace = true }
cohesix-net-constants = { workspace = true }
cohesix-proto = { workspace = true }
cohesix-worker-evidence = { workspace = true }
cohesix-rest = { path = "../../crates/cohesix-rest", optional = true }
secure9p-codec = { workspace = true }
nine-door = { path = "../nine-door", optional = true }
gpu-bridge-host = { path = "../gpu-bridge-host", default-features = false, optional = true }
log = "0.4.33"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
fs2 = "0.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
