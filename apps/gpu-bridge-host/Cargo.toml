# Author: Lukas Bower
# Purpose: Define the gpu-bridge-host crate metadata, features, and dependencies.
# Copyright 2026 Lukas Bower
[package]
name = "gpu-bridge-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
cohsh-core = { workspace = true }
cohesix-rest = { path = "../../crates/cohesix-rest", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
nvml-wrapper = { version = "0.12.1", optional = true }
host-cuda = { path = "../../crates/host-cuda", optional = true }

[features]
default = ["nvml", "cuda", "rest"]
nvml = ["nvml-wrapper"]
cuda = ["host-cuda"]
rest = ["cohesix-rest"]
