# Author: Lukas Bower
# Purpose: Configure the Cohesix host bridge CLI crate.
# Copyright 2026 Lukas Bower
[package]
name = "coh"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cohesix host bridge CLI (mount, gpu, telemetry pull)"

[features]
default = ["nvml", "cuda"]
mock = []
fuse = ["dep:fuser"]
nvml = ["gpu-bridge-host/nvml"]
cuda = ["gpu-bridge-host/cuda"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
cohesix-net-constants = { workspace = true }
cohesix-ticket = { workspace = true }
cohesix-rest = { path = "../../crates/cohesix-rest" }
cohsh = { path = "../cohsh", features = ["tcp"] }
cohsh-core = { workspace = true }
secure9p-codec = { workspace = true }
gpu-bridge-host = { path = "../gpu-bridge-host" }
nine-door = { path = "../nine-door" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "0.8"
libc = "0.2"
fs2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.15" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
fuser = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3.12"
