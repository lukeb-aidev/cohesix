# Author: Lukas Bower
# Purpose: Configure the Cohesix host bridge CLI crate.
# Copyright 2026 Lukas Bower
[package]
name = "coh"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cohesix host bridge CLI (mount, gpu, telemetry pull)"

[[bin]]
name = "coh"
path = "src/main.rs"
test = false

[features]
default = ["nvml", "cuda"]
mock = []
fuse = ["dep:fuser"]
nvml = ["gpu-bridge-host/nvml"]
cuda = ["gpu-bridge-host/cuda"]

[dependencies]
coh-cli = { path = "../../crates/coh-cli" }
ed25519-dalek = { workspace = true }
cohesix-identity = { workspace = true }
cohesix-authority = { workspace = true, features = ["std"] }
cohesix-evidence = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
cohesix-net-constants = { workspace = true }
cohesix-ticket = { workspace = true }
cohesix-worker-evidence = { workspace = true }
cohesix-attestation = { workspace = true }
getrandom = "0.4.3"
cohesix-rest = { path = "../../crates/cohesix-rest" }
cohsh = { path = "../cohsh", features = ["tcp"] }
cohsh-core = { workspace = true }
secure9p-codec = { workspace = true }
gpu-bridge-host = { path = "../gpu-bridge-host" }
nine-door = { path = "../nine-door" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = "1.1.4"
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["process"] }
fs2 = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0" }

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18.0", features = ["libfuse3"], optional = true }

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
fuser = { version = "0.18.0", optional = true }
