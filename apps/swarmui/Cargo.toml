# Author: Lukas Bower
# Purpose: Configure the SwarmUI Tauri host application.
# Copyright 2026 Lukas Bower
[package]
name = "swarmui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "SwarmUI desktop client for Cohesix (Tauri host UI)"

[[bin]]
name = "swarmui"
path = "src-tauri/main.rs"
test = false
bench = false

[features]
default = ["offline-cache", "rest"]
offline-cache = []
rest = ["cohsh/rest"]

[dependencies]
cohsh = { path = "../cohsh", default-features = false, features = ["tcp"] }
cohsh-core = { workspace = true }
cohesix-ticket = { workspace = true }
secure9p-codec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ciborium = "0.2.2"
toml = "1.1.3"
log = "0.4.33"
tauri = { version = "2.11.5", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = { version = "2.6.3", default-features = false }

[dev-dependencies]
anyhow = { workspace = true }
nine-door = { path = "../nine-door" }
serde_json = { workspace = true }
tempfile = "3.27.0"
