[package]
name = "cas-tool"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
cohesix-authority = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["env"] }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cohesix-cas = { workspace = true }
cohesix-rest = { path = "../../crates/cohesix-rest" }
ed25519-dalek = { workspace = true }
signature = { workspace = true }
cohesix-ticket = { workspace = true }
cohsh = { path = "../cohsh", features = ["tcp"] }

[dev-dependencies]
tempfile = "3.27.0"
