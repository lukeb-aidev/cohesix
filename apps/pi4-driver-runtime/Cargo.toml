[package]
name = "pi4-driver-runtime"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
console-network-abi = { workspace = true }
font8x8 = { version = "0.3.1", default-features = false }
pi4-driver-abi = { workspace = true }
sel4-sys = { path = "../../crates/sel4-sys" }

[build-dependencies]
cargo-build-directive = { workspace = true }

[[bin]]
name = "pi4-driver-serial"
test = false
bench = false

[[bin]]
name = "pi4-driver-usb"
test = false
bench = false

[[bin]]
name = "pi4-driver-hdmi"
test = false
bench = false

[[bin]]
name = "pi4-driver-genet"
test = false
bench = false

[[bin]]
name = "pi4-driver-cyw43"
test = false
bench = false

[[bin]]
name = "pi4-driver-sdio"
test = false
bench = false

[[bin]]
name = "pi4-driver-pcie"
test = false
bench = false
