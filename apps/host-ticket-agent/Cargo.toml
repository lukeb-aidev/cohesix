# Author: Lukas Bower
# Purpose: Configure the host-ticket-agent crate for ticket-driven host orchestration.
# Copyright 2026 Lukas Bower
[package]
name = "host-ticket-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpu-bridge-host = { path = "../gpu-bridge-host", default-features = false }
cohesix-rest = { path = "../../crates/cohesix-rest" }
cohesix-authority = { workspace = true, features = ["std"] }
cohesix-evidence = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
coh = { path = "../coh" }
cohesix-ticket = { workspace = true }
cohsh = { path = "../cohsh", features = ["tcp", "rest"] }
cohsh-core = { workspace = true }
fs2 = "0.4.3"
libc = "0.2.189"
hex = { workspace = true }
host-sidecar-bridge = { path = "../host-sidecar-bridge" }
sidecar-bus = { path = "../sidecar-bus", features = ["live", "modbus", "dnp3"] }
nine-door = { path = "../nine-door" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
