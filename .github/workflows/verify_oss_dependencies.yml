# Author: Lukas Bower
# Purpose: Run periodic open-source dependency audit artifacts for Cohesix.
# Copyright 2026 Lukas Bower

name: OSS Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSS audit script
        run: scripts/run_oss_audit.sh --demo --output oss_audit_out

      - name: Upload OSS audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oss-audit
          path: oss_audit_out/
