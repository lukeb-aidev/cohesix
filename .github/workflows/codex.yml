# Author: Lukas Bower
# Purpose: Provide a manually triggered Codex workflow for repository-level agent checks.
# Copyright 2026 Lukas Bower

name: Codex Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex:
    name: codex
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate agent charter exists
        run: test -f AGENTS.md
