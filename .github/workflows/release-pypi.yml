# Author: Lukas Bower
# Purpose: Publish the tagged Cohesix 1.2.0 SDK as exact, reviewer-approved PyPI distributions.
# Copyright 2026 Lukas Bower

name: Publish Cohesix Python 1.2.0

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cohesix-pypi-1-2-0
  cancel-in-progress: false

jobs:
  build:
    name: Build and check tagged SDK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out reviewed release tag
        uses: actions/checkout@v4
        with:
          ref: v1.2.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t refs/tags/v1.2.0)" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse 'refs/tags/v1.2.0^{commit}')"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
          test -z "$(git status --porcelain)"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > release-source.txt

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install isolated package tools
        run: python -m pip install --disable-pip-version-check setuptools==84.0.0 wheel==0.48.0 packaging==26.3 twine==7.0.0

      - name: Verify package metadata and public links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from urllib.request import Request, urlopen
          from packaging.version import Version

          project = tomllib.loads(Path('tools/cohesix-py/pyproject.toml').read_text())['project']
          readme = Path('tools/cohesix-py/README.md').read_text()
          expected = str(Version('1.2.0'))
          if expected != '1.2.0' or project['name'] != 'cohesix' or project['version'] != expected:
              raise SystemExit('Python project version differs from Release B')
          if "python3 -m pip install 'cohesix==1.2.0'" not in readme:
              raise SystemExit('Release B install command missing')
          for link in sorted(set(project['urls'].values())):
              if not link.startswith('https://'):
                  raise SystemExit('project URL is not public HTTPS')
              with urlopen(Request(link, method='HEAD'), timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f'broken project URL: {link}')
          PY

      - name: Build and validate selected distributions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install/build_python_package.py \
            --repo . \
            --inventory configs/generated/implementation_surface_inventory.json \
            --out out/pypi-build
          python -m twine check --strict \
            out/pypi-build/cohesix-1.2.0-py3-none-any.whl \
            out/pypi-build/cohesix-1.2.0.tar.gz
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tarfile
          import zipfile

          build = Path('out/pypi-build')
          readme = Path('tools/cohesix-py/README.md').read_text()
          with zipfile.ZipFile(build / 'cohesix-1.2.0-py3-none-any.whl') as wheel:
              wheel_metadata = BytesParser().parsebytes(
                  wheel.read('cohesix-1.2.0.dist-info/METADATA')
              )
          with tarfile.open(build / 'cohesix-1.2.0.tar.gz') as sdist:
              member = sdist.extractfile('cohesix-1.2.0/PKG-INFO')
              if member is None:
                  raise SystemExit('source distribution metadata missing')
              sdist_metadata = BytesParser().parsebytes(member.read())
          for metadata in (wheel_metadata, sdist_metadata):
              if metadata['Name'] != 'cohesix' or metadata['Version'] != '1.2.0':
                  raise SystemExit('built distribution identity mismatch')
              if metadata.get_payload().strip() != readme.strip():
                  raise SystemExit('built long description differs from reviewed README')
          PY
          python -m venv /tmp/cohesix-pypi-smoke
          /tmp/cohesix-pypi-smoke/bin/python -m pip install --no-deps \
            out/pypi-build/cohesix-1.2.0-py3-none-any.whl
          /tmp/cohesix-pypi-smoke/bin/python -c 'import cohesix, importlib.metadata; assert importlib.metadata.version("cohesix") == "1.2.0"'
          /tmp/cohesix-pypi-smoke/bin/cohesix-journey --help > /dev/null
          /tmp/cohesix-pypi-smoke/bin/cohesix-playbook --help > /dev/null

      - name: Record exact upload bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff/dist
          cp out/pypi-build/cohesix-1.2.0-py3-none-any.whl \
             out/pypi-build/cohesix-1.2.0.tar.gz handoff/dist/
          cp out/pypi-build/distributions.json release-source.txt handoff/
          (cd handoff && sha256sum dist/* distributions.json release-source.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat handoff/SHA256SUMS

      - name: Retain reviewed distributions
        uses: actions/upload-artifact@v4
        with:
          name: cohesix-1.2.0-distributions
          path: handoff/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Review and upload exact distributions
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Retrieve checked distributions
        uses: actions/download-artifact@v4
        with:
          name: cohesix-1.2.0-distributions
          path: handoff

      - name: Verify handoff and inspect PyPI state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          cd handoff
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          paths = sorted(Path('dist').iterdir())
          expected_names = {
              'cohesix-1.2.0-py3-none-any.whl',
              'cohesix-1.2.0.tar.gz',
          }
          if {path.name for path in paths} != expected_names:
              raise SystemExit('unexpected distribution handoff')
          expected = {path.name: sha256(path.read_bytes()).hexdigest()
                      for path in paths}
          report = json.loads(Path('distributions.json').read_text())
          recorded = {row['filename']: row['sha256']
                      for row in report['artifacts']}
          source = Path('release-source.txt').read_text().strip()
          if (report['schema'] != 'cohesix-python-distributions/v1'
                  or recorded != expected or len(source) != 40
                  or any(char not in '0123456789abcdef' for char in source)):
              raise SystemExit('distribution manifest or source identity differs')
          try:
              with urlopen('https://pypi.org/pypi/cohesix/1.2.0/json',
                           timeout=15) as response:
                  version = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              version = None
          if version is None:
              publish = 'true'
          else:
              observed = {row['filename']: row['digests']['sha256']
                          for row in version['urls']}
              if observed != expected:
                  raise SystemExit('PyPI has different or partial 1.2.0 files')
              publish = 'false'
              print('Exact 1.2.0 files are already published')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'publish={publish}\n')
          PY

      - name: Publish to PyPI with short-lived OIDC credentials
        if: steps.preflight.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: handoff/dist/
