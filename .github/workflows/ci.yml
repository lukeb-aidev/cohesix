# Author: Lukas Bower
# Purpose: Run required x86 host Rust validation checks for Cohesix on GitHub Actions.
# Copyright 2026 Lukas Bower

name: Cohesix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit cargo-deny

      - name: Verify tracked Cargo lockfile
        run: cargo metadata --locked --no-deps

      - name: Generate manifest-derived policy artifacts
        run: |
          cargo run -q -p coh-rtc -- \
            configs/root_task.toml \
            --out apps/root-task/src/generated \
            --manifest out/manifests/root_task_resolved.json

      - name: Rust fmt check (workspace)
        run: cargo fmt --all -- --check

      - name: Rust clippy (workspace, host-safe set)
        run: cargo clippy --workspace --all-targets --exclude swarmui --exclude coh --exclude host-ticket-agent --exclude root-task -- -D warnings

      - name: Rust check (workspace, host-safe set)
        run: cargo check --workspace --exclude swarmui --exclude coh --exclude host-ticket-agent --exclude root-task

      - name: Rust test (secure9p-codec)
        run: cargo test -p secure9p-codec --quiet

      - name: Rust test (integration crate)
        run: cargo test -p tests --quiet

      - name: Rust test (workspace, host-safe set)
        run: cargo test --workspace --exclude swarmui --exclude coh --exclude host-ticket-agent --exclude root-task --quiet

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny advisories
        run: cargo deny check advisories
