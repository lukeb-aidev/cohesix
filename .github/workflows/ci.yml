# Author: Lukas Bower
# Purpose: Run required x86 host Rust validation checks for Cohesix on GitHub Actions.
# Copyright 2026 Lukas Bower

name: Cohesix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Rust check (workspace, host-safe set)
        run: cargo check --workspace --exclude swarmui

      - name: Rust test (secure9p-codec)
        run: cargo test -p secure9p-codec --quiet

      - name: Rust test (integration crate)
        run: cargo test -p tests --quiet

      - name: Rust test (workspace, host-safe set)
        run: cargo test --workspace --exclude swarmui --quiet
