# Author: Lukas Bower
# Purpose: Run clean-runner Cohesix source, test, VM-boundary, and dependency gates.
# Copyright 2026 Lukas Bower

name: Cohesix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when GitHub schedules are most heavily loaded.
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  ACTIONLINT_ARCHIVE_SHA256: aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f
  ACTIONLINT_VERSION: 1.7.12
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RIPGREP_ARCHIVE_SHA256: 378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715
  RIPGREP_VERSION: 15.1.0
  RUST_BACKTRACE: '1'

jobs:
  checks:
    name: source-and-tests
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-none

      - name: Install pinned CI tools
        run: |
          actionlint_archive="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}.tar.gz"
          actionlint_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_darwin_arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${actionlint_archive}" "${actionlint_url}"
          printf '%s  %s\n' "${ACTIONLINT_ARCHIVE_SHA256}" "${actionlint_archive}" | shasum -a 256 --check
          mkdir -p "${actionlint_dir}"
          tar -xzf "${actionlint_archive}" -C "${actionlint_dir}" actionlint
          "${actionlint_dir}/actionlint" -version

          ripgrep_archive="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}.tar.gz"
          ripgrep_dir="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}"
          ripgrep_url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${ripgrep_archive}" "${ripgrep_url}"
          printf '%s  %s\n' "${RIPGREP_ARCHIVE_SHA256}" "${ripgrep_archive}" | shasum -a 256 --check
          mkdir -p "${ripgrep_dir}"
          tar -xzf "${ripgrep_archive}" --strip-components=1 -C "${ripgrep_dir}"
          "${ripgrep_dir}/rg" --version

          printf '%s\n' "${actionlint_dir}" "${ripgrep_dir}" >> "${GITHUB_PATH}"

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('Cargo.lock') }}

      - name: Prepare retained evidence paths
        run: |
          mkdir -p out/ci/dependency-trees out/ci/runner out/test-plan/github-actions
          uname -a > out/ci/runner/uname.txt
          sw_vers > out/ci/runner/macos.txt
          rustc --version --verbose > out/ci/runner/rustc.txt
          python3 --version > out/ci/runner/python.txt 2>&1

      - name: Verify repository and workflow policy
        run: |
          test -s AGENTS.md
          test -s docs/BUILD_PLAN.md
          actionlint .github/workflows/*.yml
          scripts/ci/test_plan_run.sh --list

      - name: Run staged integrity gate
        run: scripts/ci/test_plan_run.sh --target qemu --stage 1 --state-dir out/test-plan/github-actions

      - name: Rust fmt check (workspace)
        run: cargo fmt --all -- --check

      - name: Rust clippy (workspace)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust check (workspace)
        run: cargo check --locked --workspace

      - name: Rust test (workspace)
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Rust risk ratchet
        run: |
          python3 scripts/ci/test_rust_risk_gate.py
          # The Rust setup action exports its canonical Cargo cache location;
          # the hardened gate resolves and isolates that location itself.
          unset CARGO_HOME
          scripts/ci/rust_risk_gate.sh --baseline docs/audit/rust_risk_baseline.toml

      - name: Record VM dependency boundaries
        run: |
          cargo tree --locked -p root-task --target aarch64-unknown-none -e normal --no-default-features --features release-qemu > out/ci/dependency-trees/root-task-qemu.txt
          cargo tree --locked -p root-task --target aarch64-unknown-none -e normal --no-default-features --features release-pi4 > out/ci/dependency-trees/root-task-pi4.txt
          cargo tree --locked -p pi4-driver-runtime --target aarch64-unknown-none -e normal > out/ci/dependency-trees/pi4-driver-runtime.txt

      - name: Upload source and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-and-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/ci/dependency-trees/
            out/ci/runner/
            out/test-plan/github-actions/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_DENY_VERSION: 0.20.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1

      - name: Prepare dependency audit evidence
        run: |
          mkdir -p out/ci/dependency-audit
          : > out/ci/dependency-audit/cargo-audit.log
          : > out/ci/dependency-audit/cargo-deny.log

      - name: Install pinned dependency audit tools
        run: |
          cargo install --locked --force --version "${CARGO_AUDIT_VERSION}" cargo-audit
          cargo install --locked --force --version "${CARGO_DENY_VERSION}" cargo-deny
          cargo audit --version
          cargo deny --version

      - name: Cargo audit
        run: cargo audit 2>&1 | tee out/ci/dependency-audit/cargo-audit.log

      - name: Cargo deny advisories
        if: ${{ always() }}
        run: cargo deny check advisories 2>&1 | tee out/ci/dependency-audit/cargo-deny.log

      - name: Upload dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/dependency-audit/
          if-no-files-found: error
          retention-days: 30

  ci:
    name: ci
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - checks
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every merge gate to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          failed=0
          for gate in \
            "source-and-tests=${CHECKS_RESULT}" \
            "dependency-audit=${DEPENDENCY_AUDIT_RESULT}"
          do
            if [[ "${gate}" != *=success ]]; then
              echo "::error title=Required gate did not pass::${gate}"
              failed=1
            fi
          done
          exit "${failed}"
