# Author: Lukas Bower
# Purpose: Run Cohesix source, test-plan, VM-boundary, and dependency gates on GitHub Actions.
# Copyright 2026 Lukas Bower

name: Cohesix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when GitHub schedules are most heavily loaded.
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RIPGREP_ARCHIVE_SHA256: 378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715
  RIPGREP_VERSION: 15.1.0
  RUST_BACKTRACE: '1'

jobs:
  quality:
    name: source-quality
    if: github.event_name != 'schedule'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: clippy, rustfmt
          targets: aarch64-unknown-none

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('Cargo.lock') }}

      - name: Verify repository policy and pinned inputs
        run: |
          test -s AGENTS.md
          test -s docs/BUILD_PLAN.md
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          cargo metadata --locked --no-deps
          scripts/ci/test_plan_run.sh --list

      - name: Generated artifact drift guard
        run: scripts/check-generated.sh

      - name: Rust fmt check (workspace)
        run: cargo fmt --all -- --check

      - name: Rust clippy (workspace)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust check (workspace)
        run: cargo check --locked --workspace

      - name: Rust risk ratchet
        run: cargo run --quiet --locked -p rust-risk-audit -- --baseline docs/audit/rust_risk_baseline.toml

  workspace-tests:
    name: workspace-tests
    needs:
      - quality
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt
          targets: aarch64-unknown-none

      - name: Install pinned ripgrep 15.1.0
        run: |
          archive="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}.tar.gz"
          tool_dir="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${archive}" "${url}"
          printf '%s  %s\n' "${RIPGREP_ARCHIVE_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${tool_dir}"
          "${tool_dir}/rg" --version
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Restore Rust build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('Cargo.lock') }}

      - name: Rust test (workspace)
        run: cargo test --locked --workspace -- --test-threads=1

  staged-host-gates:
    name: staged-host-gates
    needs:
      - quality
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt
          targets: aarch64-unknown-none

      - name: Install pinned ripgrep 15.1.0
        run: |
          archive="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}.tar.gz"
          tool_dir="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${archive}" "${url}"
          printf '%s  %s\n' "${RIPGREP_ARCHIVE_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${tool_dir}"
          "${tool_dir}/rg" --version
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Restore Rust build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('Cargo.lock') }}

      - name: Prepare retained evidence paths
        run: |
          mkdir -p out/ci/dependency-trees out/ci/runner out/test-plan/github-actions-qemu
          uname -a > out/ci/runner/uname.txt
          sw_vers > out/ci/runner/macos.txt
          rustc --version --verbose > out/ci/runner/rustc.txt
          python3 --version > out/ci/runner/python.txt 2>&1

      - name: List staged Test Plan
        run: scripts/ci/test_plan_run.sh --list

      - name: Run staged integrity gate
        run: scripts/ci/test_plan_run.sh --target qemu --stage 1 --state-dir out/test-plan/github-actions-qemu

      - name: Run staged host and VM-boundary gates
        run: scripts/ci/test_plan_run.sh --target qemu --stage 2 --state-dir out/test-plan/github-actions-qemu

      - name: Record VM dependency boundaries
        run: |
          cargo tree --locked -p root-task --target aarch64-unknown-none -e normal --no-default-features --features release-qemu > out/ci/dependency-trees/root-task-qemu.txt
          cargo tree --locked -p root-task --target aarch64-unknown-none -e normal --no-default-features --features release-pi4 > out/ci/dependency-trees/root-task-pi4.txt
          cargo tree --locked -p pi4-driver-runtime --target aarch64-unknown-none -e normal > out/ci/dependency-trees/pi4-driver-runtime.txt

      - name: Upload staged gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-host-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/ci/dependency-trees/
            out/ci/runner/
            out/test-plan/github-actions-qemu/
          if-no-files-found: error
          retention-days: 14

  qemu-packaging:
    name: qemu-packaging
    needs:
      - quality
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MACFUSE_VERSION: 5.3.3
      MACFUSE_DMG_SHA256: 7a0b7b66c0e7f8932707d1215dc9cf486e178d097ae0a2dcdf17d8530566aa15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1
        with:
          components: rustfmt
          targets: aarch64-unknown-none

      - name: Install pinned ripgrep 15.1.0
        run: |
          archive="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}.tar.gz"
          tool_dir="${RUNNER_TEMP}/ripgrep-${RIPGREP_VERSION}"
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${archive}" "${url}"
          printf '%s  %s\n' "${RIPGREP_ARCHIVE_SHA256}" "${archive}" | shasum -a 256 --check
          mkdir -p "${tool_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${tool_dir}"
          "${tool_dir}/rg" --version
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Restore Rust build artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('Cargo.lock') }}

      - name: Prepare QEMU packaging evidence
        run: |
          mkdir -p out/ci/qemu-packaging
          {
            uname -a
            sw_vers
            rustc --version --verbose
          } > out/ci/qemu-packaging/runner.txt

      - name: Prepare pinned macFUSE build SDK
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/macfuse-sdk/Core.pkg/Payload/usr/local/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ runner.temp }}/macfuse-sdk/Core.pkg/Payload
        run: |
          dmg="${RUNNER_TEMP}/macfuse-${MACFUSE_VERSION}.dmg"
          mountpoint="${RUNNER_TEMP}/macfuse-mount"
          sdk="${RUNNER_TEMP}/macfuse-sdk"
          url="https://github.com/macfuse/macfuse/releases/download/macfuse-${MACFUSE_VERSION}/macfuse-${MACFUSE_VERSION}.dmg"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --location --silent --show-error --output "${dmg}" "${url}"
          printf '%s  %s\n' "${MACFUSE_DMG_SHA256}" "${dmg}" | shasum -a 256 --check
          mkdir -p "${mountpoint}"
          hdiutil attach -readonly -nobrowse -mountpoint "${mountpoint}" "${dmg}" >/dev/null
          trap 'hdiutil detach "${mountpoint}" >/dev/null' EXIT
          package="${mountpoint}/Install macFUSE.pkg"
          pkgutil --check-signature "${package}"
          pkgutil --expand-full "${package}" "${sdk}"
          pkg-config --exists fuse

      - name: Build and verify QEMU package
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/macfuse-sdk/Core.pkg/Payload/usr/local/lib/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ runner.temp }}/macfuse-sdk/Core.pkg/Payload
        run: |
          scripts/cohesix-build-run.sh --no-run --cargo-target aarch64-unknown-none 2>&1 | tee out/ci/qemu-packaging/build.log
          cp out/cohesix/staging/cohesix/manifest.json out/ci/qemu-packaging/payload-manifest.json
          stat -f '%z' out/cohesix/cohesix-system.cpio > out/ci/qemu-packaging/rootfs-bytes.txt
          shasum -a 256 out/cohesix/cohesix-system.cpio > out/ci/qemu-packaging/rootfs-sha256.txt
          scripts/check-generated.sh

      - name: Upload QEMU packaging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-packaging-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/qemu-packaging/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_DENY_VERSION: 0.20.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.93.1
        uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93.1

      - name: Prepare dependency audit evidence
        run: |
          mkdir -p out/ci/dependency-audit
          : > out/ci/dependency-audit/cargo-audit.log
          : > out/ci/dependency-audit/cargo-deny.log

      - name: Install pinned dependency audit tools
        run: |
          cargo install --locked --force --version "${CARGO_AUDIT_VERSION}" cargo-audit
          cargo install --locked --force --version "${CARGO_DENY_VERSION}" cargo-deny
          cargo audit --version
          cargo deny --version

      - name: Cargo audit
        run: cargo audit 2>&1 | tee out/ci/dependency-audit/cargo-audit.log

      - name: Cargo deny advisories
        if: ${{ always() }}
        run: cargo deny check advisories 2>&1 | tee out/ci/dependency-audit/cargo-deny.log

      - name: Upload dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/dependency-audit/
          if-no-files-found: error
          retention-days: 30

  ci:
    name: ci
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - quality
      - workspace-tests
      - staged-host-gates
      - qemu-packaging
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every merge gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WORKSPACE_TESTS_RESULT: ${{ needs.workspace-tests.result }}
          STAGED_HOST_GATES_RESULT: ${{ needs.staged-host-gates.result }}
          QEMU_PACKAGING_RESULT: ${{ needs.qemu-packaging.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          failed=0
          for gate in \
            "source-quality=${QUALITY_RESULT}" \
            "workspace-tests=${WORKSPACE_TESTS_RESULT}" \
            "staged-host-gates=${STAGED_HOST_GATES_RESULT}" \
            "qemu-packaging=${QEMU_PACKAGING_RESULT}" \
            "dependency-audit=${DEPENDENCY_AUDIT_RESULT}"
          do
            if [[ "${gate}" != *=success ]]; then
              echo "::error title=Required gate did not pass::${gate}"
              failed=1
            fi
          done
          exit "${failed}"
