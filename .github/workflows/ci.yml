# Author: Lukas Bower
# Purpose: Run a small Cohesix health check and a separate weekly dependency audit.
# Copyright 2026 Lukas Bower

name: Cohesix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
  schedule:
    # Keep advisory visibility without putting network-fetched databases on
    # every source change.
    - cron: '17 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: 3.13.14
  RUST_TOOLCHAIN: 1.97.1

jobs:
  ci:
    name: ci
    if: ${{ github.event_name != 'schedule' }}
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.97.1
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: aarch64-unknown-none

      - name: Install Python 3.13.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Validate source contracts
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          scripts/check-generated.sh

      - name: Check shipped host code
        run: cargo check --workspace

      - name: Run default workspace tests
        run: cargo test --workspace -- --test-threads=1

      - name: Check target feature compilation
        run: |
          cargo test -p root-task --no-default-features --features driver-tests-qemu --lib --no-run
          cargo test -p root-task --no-default-features --features driver-tests-pi4 --lib --no-run
          cargo check -p pi4-driver-runtime --target aarch64-unknown-none

  dependency-audit:
    name: dependency-audit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_DENY_VERSION: 0.20.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain 1.97.1
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install pinned audit tools
        run: |
          cargo install --locked --version "${CARGO_AUDIT_VERSION}" cargo-audit
          cargo install --locked --version "${CARGO_DENY_VERSION}" cargo-deny

      - name: Check dependency advisories
        run: |
          cargo audit
          cargo deny check advisories
