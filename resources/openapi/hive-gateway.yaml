# Purpose: Define the OpenAPI description for the Cohesix hive-gateway REST API.
# Author: Lukas Bower
openapi: 3.1.0
info:
  title: Cohesix Hive Gateway
  version: 0.1.0
  description: |-
    Host-only REST gateway that projects Cohesix console/file semantics into a
    JSON API. Responses mirror OK/ERR/END semantics and enforce manifest bounds.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/meta/bounds:
    get:
      summary: Manifest-derived bounds, paths, and optional Worker declarations.
      responses:
        "200":
          description: Boundaries derived from the active manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundsResponse"
  /v1/meta/status:
    get:
      summary: Gateway connection, backend class, optional Worker acceptance, and broker counters.
      responses:
        "200":
          description: Runtime gateway status and broker metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatusResponse"
  /v1/fs/ls:
    get:
      summary: List directory entries (LS).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/cat:
    get:
      summary: Read file contents (CAT).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: max_bytes
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Read operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/tail:
    get:
      summary: Tail file contents (TAIL).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: max_bytes
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: lines
          required: false
          description: Optional tail line count. Values must be between 1 and 256.
          schema:
            type: integer
            minimum: 1
            maximum: 256
      responses:
        "200":
          description: Tail operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/echo:
    post:
      summary: Append a single line (ECHO).
      security:
        - bearerAuth: []
        - requestAuthHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
      responses:
        "200":
          description: >
            Echo operation response. A successful queen telemetry segment-control
            write may return the provider-assigned segment ID as the sole `lines`
            entry; clients must retain `/latest` as a compatibility fallback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "401":
          description: Missing or invalid request authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/openapi.yaml:
    get:
      summary: OpenAPI 3.1 specification.
      responses:
        "200":
          description: OpenAPI specification (YAML).
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: Swagger UI.
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Required for mutating endpoints. Supply `Authorization: Bearer <token>`.
    requestAuthHeader:
      type: apiKey
      in: header
      name: x-cohesix-auth
      description: >
        Alternative to bearer auth for mutating endpoints.
  schemas:
    GatewayResponse:
      type: object
      required:
        - status
        - verb
        - path
        - end
      properties:
        status:
          type: string
          enum: ["OK", "ERR"]
        verb:
          type: string
        path:
          type: string
        end:
          type: boolean
        lines:
          type: array
          items:
            type: string
        bytes:
          type: integer
          minimum: 0
        error:
          type: string
    EchoRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        line:
          type: string
    BoundsResponse:
      type: object
      required:
        - manifest_sha256
        - secure9p
        - console
        - paths
        - control_plane
        - policy
        - observability
      properties:
        manifest_sha256:
          type: string
        secure9p:
          type: object
          required: [msize, walk_depth]
          properties:
            msize:
              type: integer
            walk_depth:
              type: integer
        console:
          type: object
          required:
            - max_line_len
            - max_path_len
            - max_json_len
            - max_id_len
            - max_echo_len
            - max_ticket_len
          properties:
            max_line_len:
              type: integer
            max_path_len:
              type: integer
            max_json_len:
              type: integer
            max_id_len:
              type: integer
            max_echo_len:
              type: integer
            max_ticket_len:
              type: integer
        paths:
          type: object
          required:
            - queen_ctl
            - queen_lifecycle_ctl
            - queen_schedule_ctl
            - queen_lease_ctl
            - queen_export_ctl
            - policy_ctl
            - log
          properties:
            queen_ctl:
              type: string
            queen_lifecycle_ctl:
              type: string
            queen_schedule_ctl:
              type: string
            queen_lease_ctl:
              type: string
            queen_export_ctl:
              type: string
            policy_ctl:
              type: string
            log:
              type: string
        control_plane:
          type: object
          required: [schedule, lease, export]
          properties:
            schedule:
              type: object
              required: [enable, queue_max_entries, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                queue_max_entries:
                  type: integer
                ctl_max_bytes:
                  type: integer
            lease:
              type: object
              required: [enable, active_max_entries, preemptions_max_entries, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                active_max_entries:
                  type: integer
                preemptions_max_entries:
                  type: integer
                ctl_max_bytes:
                  type: integer
            export:
              type: object
              required: [enable, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                ctl_max_bytes:
                  type: integer
        policy:
          type: object
          required: [enable, queue_max_entries, queue_max_bytes, ctl_max_bytes]
          properties:
            enable:
              type: boolean
            queue_max_entries:
              type: integer
            queue_max_bytes:
              type: integer
            ctl_max_bytes:
              type: integer
        observability:
          type: object
          required: [proc_schedule, proc_lease]
          properties:
            proc_schedule:
              type: object
              required: [summary, queue, summary_bytes, queue_bytes]
              properties:
                summary:
                  type: boolean
                queue:
                  type: boolean
                summary_bytes:
                  type: integer
                queue_bytes:
                  type: integer
            proc_lease:
              type: object
              required: [summary, active, preemptions, summary_bytes, active_bytes, preemptions_bytes]
              properties:
                summary:
                  type: boolean
                active:
                  type: boolean
                preemptions:
                  type: boolean
                summary_bytes:
                  type: integer
                active_bytes:
                  type: integer
                preemptions_bytes:
                  type: integer
        worker_runtime:
          $ref: "#/components/schemas/WorkerRuntimeBounds"
    WorkerRuntimeBounds:
      type: object
      description: >
        Optional compiler-generated declaration bounds. Absence means unknown;
        this object is not runtime READY or target proof.
      required:
        - roles
        - task_abi_schema
        - task_abi_version
        - worker_observation_schema
        - worker_integration_evidence_schema
        - maximum_live_tasks
        - canonical_telemetry_template
        - shard_bits
        - legacy_worker_alias
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/WorkerRoleBounds"
        task_abi_schema:
          type: string
        task_abi_version:
          type: integer
          minimum: 1
        worker_observation_schema:
          type: string
        worker_integration_evidence_schema:
          type: string
        maximum_live_tasks:
          type: integer
          minimum: 1
        canonical_telemetry_template:
          type: string
          const: /shard/<label>/worker/<id>/telemetry
        shard_bits:
          type: integer
          minimum: 1
          maximum: 8
        legacy_worker_alias:
          type: boolean
    WorkerRoleBounds:
      type: object
      required: [role, declaration, executable_slots]
      properties:
        role:
          type: string
          enum: [worker-heartbeat, worker-gpu, worker-bus, worker-lora]
        declaration:
          type: string
          enum: [executable, model-only]
        executable_slots:
          type: integer
          minimum: 0
    GatewayStatusResponse:
      type: object
      required:
        - connected
        - reconnects
        - connects
        - broker
      properties:
        connected:
          type: boolean
          description: Console connection only; never target execution proof.
        backend_class:
          type: string
          enum: [host-model, console-projection, unknown]
        worker_acceptance:
          $ref: "#/components/schemas/WorkerAcceptanceSummary"
        worker_acceptance_diagnostic:
          $ref: "#/components/schemas/WorkerAcceptanceDiagnostic"
        last_error:
          type: string
        last_change_unix_ms:
          type: integer
          minimum: 0
        reconnects:
          type: integer
          minimum: 0
        connects:
          type: integer
          minimum: 0
        broker:
          $ref: "#/components/schemas/BrokerStatusResponse"
    WorkerAcceptanceSummary:
      type: object
      description: >
        Redacted projection produced only after shared-library validation of a
        bounded local acceptance record. It adds no authority route.
      required:
        - schema
        - record_kind
        - evidence_sha256
        - verdict
        - target
        - execution_proof
        - target_session
        - topology_sha256
      properties:
        schema:
          type: string
          enum: [cohesix-worker-task-evidence/v1]
        record_kind:
          type: string
          enum: [target-component]
        evidence_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        verdict:
          type: string
          enum: [PASS, FAIL]
        target:
          type: string
          enum: [qemu, pi4]
        execution_proof:
          type: string
          enum: [none, qemu, fresh-pi]
        target_session:
          $ref: "#/components/schemas/TargetSessionSummary"
        topology_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerAcceptanceRoleSummary"
    WorkerAcceptanceRoleSummary:
      type: object
      required:
        - role
        - lifecycle
        - artifact
        - receipt
        - execution_proof
        - slot
        - lease_epoch
        - supervisor_generation
        - cap_generation
        - image_sha256
        - ready_sequence
        - completion_sequence
        - core
        - scheduling_context
        - object_inventory
      properties:
        role:
          type: string
          enum: [worker-heartbeat, worker-gpu, worker-lora]
        lifecycle:
          type: string
          enum: [absent, queued, starting, ready, closing, faulted, terminal]
        artifact:
          type: string
          enum: [missing, verified, mismatch]
        receipt:
          type: string
          enum: [none, pending, confirmed, rejected, stale]
        execution_proof:
          type: string
          enum: [none, host-model, qemu, fresh-pi]
        slot:
          type: integer
          minimum: 0
        lease_epoch:
          type: integer
          minimum: 1
        supervisor_generation:
          type: integer
          minimum: 1
        cap_generation:
          type: integer
          minimum: 1
        image_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        ready_sequence:
          type: integer
          minimum: 0
        completion_sequence:
          type: integer
          minimum: 0
        core:
          type: integer
          minimum: 0
          maximum: 3
        scheduling_context:
          $ref: "#/components/schemas/WorkerSchedulingContextSummary"
        object_inventory:
          $ref: "#/components/schemas/KernelObjectInventorySummary"
    TargetSessionSummary:
      type: object
      required:
        - target_session_sha256
        - manifest_sha256
        - root_image_sha256
        - worker_archive_sha256
        - worker_image_manifest_sha256
        - worker_abi_sha256
      properties:
        target_session_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        manifest_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        root_image_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        worker_archive_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        worker_image_manifest_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        worker_abi_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    WorkerSchedulingContextSummary:
      type: object
      required: [budget_us, period_us]
      properties:
        budget_us:
          type: integer
          minimum: 1
        period_us:
          type: integer
          minimum: 1
    KernelObjectInventorySummary:
      type: object
      additionalProperties: false
      required:
        - tcbs
        - scheduling_contexts
        - reply_objects
        - vspaces
        - cnodes
        - page_tables
        - asids
        - frames
        - endpoints
        - notifications
        - fault_caps
        - timeout_fault_caps
        - cspace_slots
        - untyped_bytes
      properties:
        tcbs: {type: integer, minimum: 0}
        scheduling_contexts: {type: integer, minimum: 0}
        reply_objects: {type: integer, minimum: 0}
        vspaces: {type: integer, minimum: 0}
        cnodes: {type: integer, minimum: 0}
        page_tables: {type: integer, minimum: 0}
        asids: {type: integer, minimum: 0}
        frames: {type: integer, minimum: 0}
        endpoints: {type: integer, minimum: 0}
        notifications: {type: integer, minimum: 0}
        fault_caps: {type: integer, minimum: 0}
        timeout_fault_caps: {type: integer, minimum: 0}
        cspace_slots: {type: integer, minimum: 0}
        untyped_bytes: {type: integer, minimum: 0}
    WorkerAcceptanceDiagnostic:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - not-configured
            - incomplete-configuration
            - unsafe-root
            - outside-root
            - symlink-traversal
            - not-regular-file
            - record-too-large
            - read-failed
            - invalid-evidence
            - invalid-target-session
            - target-session-mismatch
            - manifest-mismatch
            - unsupported-record-kind
    BrokerStatusResponse:
      type: object
      required:
        - control_waiters
        - telemetry_waiters
        - control_waiters_high_water
        - telemetry_waiters_high_water
        - control_checkouts
        - telemetry_checkouts
        - pool_exhausted
        - checkout_retries
        - timeout_rejections
        - telemetry_yields
        - proc_cache_hits
        - proc_cache_misses
        - proc_cache_evictions
        - control_write_retryable_errors
        - control_write_retries
        - control_write_retry_sleep_ms
        - control_write_retry_exhaustions
        - control_write_success_after_retry
        - relay_queue_depth
        - relay_deduped
        - relay_remote_write_failures
      properties:
        control_waiters:
          type: integer
          minimum: 0
        telemetry_waiters:
          type: integer
          minimum: 0
        control_waiters_high_water:
          type: integer
          minimum: 0
        telemetry_waiters_high_water:
          type: integer
          minimum: 0
        control_checkouts:
          type: integer
          minimum: 0
        telemetry_checkouts:
          type: integer
          minimum: 0
        pool_exhausted:
          type: integer
          minimum: 0
        checkout_retries:
          type: integer
          minimum: 0
        timeout_rejections:
          type: integer
          minimum: 0
        telemetry_yields:
          type: integer
          minimum: 0
        proc_cache_hits:
          type: integer
          minimum: 0
        proc_cache_misses:
          type: integer
          minimum: 0
        proc_cache_evictions:
          type: integer
          minimum: 0
        control_write_retryable_errors:
          type: integer
          minimum: 0
        control_write_retries:
          type: integer
          minimum: 0
        control_write_retry_sleep_ms:
          type: integer
          minimum: 0
        control_write_retry_exhaustions:
          type: integer
          minimum: 0
        control_write_success_after_retry:
          type: integer
          minimum: 0
        relay_queue_depth:
          type: integer
          minimum: 0
        relay_deduped:
          type: integer
          minimum: 0
        relay_remote_write_failures:
          type: integer
          minimum: 0
