# Purpose: Define the OpenAPI description for the Cohesix hive-gateway REST API.
# Author: Lukas Bower
openapi: 3.1.0
info:
  title: Cohesix Hive Gateway
  version: 0.1.0
  description: |-
    Host-only REST gateway that projects Cohesix console/file semantics into a
    JSON API. Responses mirror OK/ERR/END semantics and enforce manifest bounds.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/meta/bounds:
    get:
      summary: Manifest-derived bounds and paths.
      responses:
        "200":
          description: Boundaries derived from the active manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoundsResponse"
  /v1/meta/status:
    get:
      summary: Gateway connection and broker status counters.
      responses:
        "200":
          description: Runtime gateway status and broker metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatusResponse"
  /v1/fs/ls:
    get:
      summary: List directory entries (LS).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/cat:
    get:
      summary: Read file contents (CAT).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: max_bytes
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Read operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/tail:
    get:
      summary: Tail file contents (TAIL).
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: max_bytes
          required: true
          schema:
            type: integer
            minimum: 1
        - in: query
          name: lines
          required: false
          description: Optional tail line count. Values must be between 1 and 256.
          schema:
            type: integer
            minimum: 1
            maximum: 256
      responses:
        "200":
          description: Tail operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/fs/echo:
    post:
      summary: Append a single line (ECHO).
      security:
        - bearerAuth: []
        - requestAuthHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
      responses:
        "200":
          description: Echo operation response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "401":
          description: Missing or invalid request authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "429":
          description: Gateway broker queue backpressure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "503":
          description: Gateway transport unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "504":
          description: Gateway broker response timed out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
  /v1/openapi.yaml:
    get:
      summary: OpenAPI 3.1 specification.
      responses:
        "200":
          description: OpenAPI specification (YAML).
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: Swagger UI.
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Required for mutating endpoints. Supply `Authorization: Bearer <token>`.
    requestAuthHeader:
      type: apiKey
      in: header
      name: x-cohesix-auth
      description: >
        Alternative to bearer auth for mutating endpoints.
  schemas:
    GatewayResponse:
      type: object
      required:
        - status
        - verb
        - path
        - end
      properties:
        status:
          type: string
          enum: ["OK", "ERR"]
        verb:
          type: string
        path:
          type: string
        end:
          type: boolean
        lines:
          type: array
          items:
            type: string
        bytes:
          type: integer
          minimum: 0
        error:
          type: string
    EchoRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        line:
          type: string
    BoundsResponse:
      type: object
      required:
        - manifest_sha256
        - secure9p
        - console
        - paths
        - control_plane
        - policy
        - observability
      properties:
        manifest_sha256:
          type: string
        secure9p:
          type: object
          required: [msize, walk_depth]
          properties:
            msize:
              type: integer
            walk_depth:
              type: integer
        console:
          type: object
          required:
            - max_line_len
            - max_path_len
            - max_json_len
            - max_id_len
            - max_echo_len
            - max_ticket_len
          properties:
            max_line_len:
              type: integer
            max_path_len:
              type: integer
            max_json_len:
              type: integer
            max_id_len:
              type: integer
            max_echo_len:
              type: integer
            max_ticket_len:
              type: integer
        paths:
          type: object
          required:
            - queen_ctl
            - queen_lifecycle_ctl
            - queen_schedule_ctl
            - queen_lease_ctl
            - queen_export_ctl
            - policy_ctl
            - log
          properties:
            queen_ctl:
              type: string
            queen_lifecycle_ctl:
              type: string
            queen_schedule_ctl:
              type: string
            queen_lease_ctl:
              type: string
            queen_export_ctl:
              type: string
            policy_ctl:
              type: string
            log:
              type: string
        control_plane:
          type: object
          required: [schedule, lease, export]
          properties:
            schedule:
              type: object
              required: [enable, queue_max_entries, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                queue_max_entries:
                  type: integer
                ctl_max_bytes:
                  type: integer
            lease:
              type: object
              required: [enable, active_max_entries, preemptions_max_entries, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                active_max_entries:
                  type: integer
                preemptions_max_entries:
                  type: integer
                ctl_max_bytes:
                  type: integer
            export:
              type: object
              required: [enable, ctl_max_bytes]
              properties:
                enable:
                  type: boolean
                ctl_max_bytes:
                  type: integer
        policy:
          type: object
          required: [enable, queue_max_entries, queue_max_bytes, ctl_max_bytes]
          properties:
            enable:
              type: boolean
            queue_max_entries:
              type: integer
            queue_max_bytes:
              type: integer
            ctl_max_bytes:
              type: integer
        observability:
          type: object
          required: [proc_schedule, proc_lease]
          properties:
            proc_schedule:
              type: object
              required: [summary, queue, summary_bytes, queue_bytes]
              properties:
                summary:
                  type: boolean
                queue:
                  type: boolean
                summary_bytes:
                  type: integer
                queue_bytes:
                  type: integer
            proc_lease:
              type: object
              required: [summary, active, preemptions, summary_bytes, active_bytes, preemptions_bytes]
              properties:
                summary:
                  type: boolean
                active:
                  type: boolean
                preemptions:
                  type: boolean
                summary_bytes:
                  type: integer
                active_bytes:
                  type: integer
                preemptions_bytes:
                  type: integer
    GatewayStatusResponse:
      type: object
      required:
        - connected
        - reconnects
        - connects
        - broker
      properties:
        connected:
          type: boolean
        last_error:
          type: string
        last_change_unix_ms:
          type: integer
          minimum: 0
        reconnects:
          type: integer
          minimum: 0
        connects:
          type: integer
          minimum: 0
        broker:
          $ref: "#/components/schemas/BrokerStatusResponse"
    BrokerStatusResponse:
      type: object
      required:
        - control_waiters
        - telemetry_waiters
        - control_waiters_high_water
        - telemetry_waiters_high_water
        - control_checkouts
        - telemetry_checkouts
        - pool_exhausted
        - checkout_retries
        - timeout_rejections
        - telemetry_yields
        - proc_cache_hits
        - proc_cache_misses
        - proc_cache_evictions
        - control_write_retryable_errors
        - control_write_retries
        - control_write_retry_sleep_ms
        - control_write_retry_exhaustions
        - control_write_success_after_retry
        - relay_queue_depth
        - relay_deduped
        - relay_remote_write_failures
      properties:
        control_waiters:
          type: integer
          minimum: 0
        telemetry_waiters:
          type: integer
          minimum: 0
        control_waiters_high_water:
          type: integer
          minimum: 0
        telemetry_waiters_high_water:
          type: integer
          minimum: 0
        control_checkouts:
          type: integer
          minimum: 0
        telemetry_checkouts:
          type: integer
          minimum: 0
        pool_exhausted:
          type: integer
          minimum: 0
        checkout_retries:
          type: integer
          minimum: 0
        timeout_rejections:
          type: integer
          minimum: 0
        telemetry_yields:
          type: integer
          minimum: 0
        proc_cache_hits:
          type: integer
          minimum: 0
        proc_cache_misses:
          type: integer
          minimum: 0
        proc_cache_evictions:
          type: integer
          minimum: 0
        control_write_retryable_errors:
          type: integer
          minimum: 0
        control_write_retries:
          type: integer
          minimum: 0
        control_write_retry_sleep_ms:
          type: integer
          minimum: 0
        control_write_retry_exhaustions:
          type: integer
          minimum: 0
        control_write_success_after_retry:
          type: integer
          minimum: 0
        relay_queue_depth:
          type: integer
          minimum: 0
        relay_deduped:
          type: integer
          minimum: 0
        relay_remote_write_failures:
          type: integer
          minimum: 0
