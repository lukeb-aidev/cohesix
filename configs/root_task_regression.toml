# Author: Lukas Bower
# Purpose: Regression manifest enabling host/policy/audit/replay surfaces for cohsh scripts.
# Copyright 2026 Lukas Bower
[meta]
author = "Lukas Bower"
purpose = "Regression manifest enabling host/policy/audit/replay surfaces."

[root_task]
schema = "1.11"

[profile]
name = "virt-aarch64"
kernel = true

[event_pump]
tick_ms = 5

[secure9p]
msize = 8192
walk_depth = 8
tags_per_session = 16
batch_frames = 1

[secure9p.short_write]
policy = "reject"

[cas]
enable = true

[cas.store]
chunk_bytes = 128

[cas.delta]
enable = true

[cas.signing]
required = true
verification_key_path = "resources/fixtures/cas_verification_key.hex"

[cache]
kernel_ops = true
dma_clean = true
dma_invalidate = true
unify_instructions = false

[dma]
protection_profile = "none"

[worker_runtime]
implementation_epoch = 26
max_workers = 8
ticket_subject_required = true
cap_backed_authority = false
notification_lifecycle = false

[[worker_runtime.roles]]
role = "worker-heartbeat"
implemented = false
ticket_scope = "/worker"
telemetry_path_template = "/shard/<label>/worker/<id>/telemetry"
lease_path_template = ""
shutdown_policy = "deferred"

[[worker_runtime.roles]]
role = "worker-gpu"
implemented = false
ticket_scope = "/gpu"
telemetry_path_template = "/shard/<label>/worker/<id>/telemetry"
lease_path_template = "/gpu/<id>/lease"
shutdown_policy = "deferred"

[[worker_runtime.roles]]
role = "worker-bus"
implemented = false
ticket_scope = "/bus"
telemetry_path_template = "/shard/<label>/worker/<id>/telemetry"
lease_path_template = ""
shutdown_policy = "deferred"

[[worker_runtime.roles]]
role = "worker-lora"
implemented = false
ticket_scope = "/worker"
telemetry_path_template = "/shard/<label>/worker/<id>/telemetry"
lease_path_template = ""
shutdown_policy = "deferred"

[worker_runtime.endpoint_caps]
required = false
attach_badge_base = 638324736
telemetry_badge_base = 638328832
lease_badge_base = 638332928
receipt_badge_base = 638337024
revoke_badge_base = 638341120
epoch_bits = 8
role_bits = 4

[worker_runtime.notifications]
enabled = false
revoke_badge = 638345216
shutdown_badge = 638349312
lease_expiry_badge = 638353408
telemetry_pressure_badge = 638357504
irq_badge = 638361600

[worker_runtime.scheduling]
profile = "non-mcs"
priority = 96
domain = 0
service_turn_budget = 64
mcs_budget_us = 0
mcs_period_us = 0
timeout_endpoint_badge = 0
consumed_budget_evidence = false

[features]
net_console = true
serial_console = true
std_console = false
std_host_tools = false

[namespaces]
role_isolation = true

[sharding]
enabled = true
shard_bits = 8
legacy_worker_alias = true

[telemetry]
ring_bytes_per_worker = 1024
frame_schema = "legacy-plaintext"

[telemetry.cursor]
retain_on_boot = false

[control_plane.schedule]
enable = true
queue_max_entries = 64
ctl_max_bytes = 8192

[control_plane.lease]
enable = true
active_max_entries = 64
preemptions_max_entries = 64
ctl_max_bytes = 8192

[control_plane.export]
enable = true
ctl_max_bytes = 2048

[observability.proc_9p]
sessions = true
outstanding = true
short_writes = true
sessions_bytes = 8192
outstanding_bytes = 128
short_writes_bytes = 128

[observability.proc_ingest]
p50_ms = true
p95_ms = true
backpressure = true
dropped = true
queued = true
watch = true
p50_ms_bytes = 64
p95_ms_bytes = 64
backpressure_bytes = 64
dropped_bytes = 64
queued_bytes = 64
watch_max_entries = 16
watch_line_bytes = 192
watch_min_interval_ms = 50
latency_samples = 32
latency_tolerance_ms = 5
counter_tolerance = 1

[observability.proc_schedule]
summary = true
queue = true
summary_bytes = 128
queue_bytes = 256

[observability.proc_lease]
summary = true
active = true
preemptions = true
summary_bytes = 160
active_bytes = 256
preemptions_bytes = 256

[ui_providers.proc_9p]
sessions = true
outstanding = true
short_writes = true

[ui_providers.proc_ingest]
p50_ms = true
p95_ms = true
backpressure = true

[ui_providers.policy_preflight]
req = true
diff = true

[ui_providers.updates]
manifest = true
status = true

[client_policies.cohsh.pool]
control_sessions = 2
telemetry_sessions = 4

[client_policies.coh.mount]
root = "/"
allowlist = ["/proc", "/queen", "/shard", "/worker", "/log", "/gpu", "/host"]

[client_policies.coh.telemetry]
root = "/queen/telemetry"
max_devices = 32
max_segments_per_device = 4
max_bytes_per_segment = 32768
max_total_bytes_per_device = 131072

[client_policies.coh.peft.export]
root = "/queen/export/lora_jobs"
max_telemetry_bytes = 131072
max_policy_bytes = 8192
max_base_model_bytes = 1024

[client_policies.coh.peft.import]
registry_root = "out/model_registry"
max_adapter_bytes = 67108864
max_lora_bytes = 65536
max_metrics_bytes = 65536
max_manifest_bytes = 8192

[client_policies.coh.peft.activate]
max_model_id_bytes = 128
max_state_bytes = 4096

[client_policies.retry]
max_attempts = 3
backoff_ms = 200
ceiling_ms = 2000
timeout_ms = 5000

[client_policies.heartbeat]
interval_ms = 15000

[client_paths]
queen_ctl = "/queen/ctl"
queen_lifecycle_ctl = "/queen/lifecycle/ctl"
queen_schedule_ctl = "/queen/schedule/ctl"
queen_lease_ctl = "/queen/lease/ctl"
queen_export_ctl = "/queen/export/ctl"
policy_ctl = "/policy/ctl"
log = "/log/queen.log"

[swarmui]
ticket_scope = "per-ticket"

[swarmui.cache]
enabled = false
max_bytes = 262144
ttl_s = 3600

[swarmui.hive]
frame_cap_fps = 60
step_ms = 16
lod_zoom_out = 0.7
lod_zoom_in = 1.25
lod_event_budget = 512
snapshot_max_events = 4096
overlay_lines = 3
detail_lines = 50
line_cap_bytes = 160
per_worker_bytes = 2048

[swarmui.paths]
telemetry_root = "/worker"
proc_ingest_root = "/proc/ingest"
worker_root = "/shard"
namespace_roots = ["/proc", "/queen", "/shard", "/worker", "/log", "/gpu"]

[ticket_limits]
max_scopes = 8
max_scope_path_len = 128
max_scope_rate_per_s = 64
bandwidth_bytes = 131072
cursor_resumes = 16
cursor_advances = 256

[[tickets]]
role = "queen"
secret = "bootstrap"

[[tickets]]
role = "worker-heartbeat"
secret = "worker"

[[tickets]]
role = "worker-gpu"
secret = "worker-gpu"

[[tickets]]
role = "worker-bus"
secret = "worker-bus"

[[tickets]]
role = "worker-lora"
secret = "worker-lora"

[sidecars.modbus]
enable = true
mount_at = "/bus"

[[sidecars.modbus.adapters]]
id = "modbus-main"
mount = "modbus-main"
scope = "modbus-main"
link = "serial"
baud = 19200
spool = { max_entries = 8, max_bytes = 512 }

[sidecars.dnp3]
enable = false
mount_at = "/bus"

[ecosystem.host]
enable = true
providers = ["systemd", "k8s"]
mount_at = "/host"

[ecosystem.audit]
enable = true
journal_max_bytes = 8192
decisions_max_bytes = 4096
replay_enable = true
replay_max_entries = 64
replay_ctl_max_bytes = 1024
replay_status_max_bytes = 1024

[ecosystem.policy]
enable = true
queue_max_entries = 32
queue_max_bytes = 4096
ctl_max_bytes = 2048
status_max_bytes = 512

[[ecosystem.policy.rules]]
id = "queen-ctl"
target = "/queen/ctl"

[[ecosystem.policy.rules]]
id = "systemd-restart"
target = "/host/systemd/*/restart"

[ecosystem.models]
enable = true
