# Author: Lukas Bower
# Purpose: Define the canonical staged and claim-specific Cohesix test action catalog.
# Copyright 2026 Lukas Bower

[catalog]
schema = "cohesix-test-plan-actions/v2"
minimum_python = "3.11"
default_claims = ["common-hermetic", "qemu-integration", "release"]
claim_tiers = [
  "common-hermetic",
  "qemu-integration",
  "pi4-transport",
  "pi4-hardware",
  "ui",
  "performance",
  "federation",
  "release",
]

[[convergence_focus]]
id = "pi4-driver"
targets = ["pi4"]
description = "Pi boot, MMIO, DMA, IRQ, cache, timer, driver-runtime ABI, networking, and physical-ownership changes."
profile = "pi4_diagnostic / configs/root_task_pi4_uboot_aarch64.toml"
authoritative_evidence = "one exact-image Pi boot, touched service/device liveness, one live operation, UART liveness, and no unexpected target fault"
priority = 100
trigger_paths = [
  "apps/pi4-driver-runtime/**",
  "crates/pi4-driver-abi/**",
  "apps/console-network-runtime/**",
  "crates/console-network-abi/**",
  "apps/root-task/src/hal/pi4_*.rs",
  "apps/root-task/src/hal/console_network.rs",
  "apps/root-task/src/hal/driver_task.rs",
  "apps/root-task/src/hal/mod.rs",
  "apps/root-task/src/drivers/driver_task_net.rs",
  "apps/root-task/tests/direct_genet_network_phasing.rs",
  "apps/root-task/src/drivers/bcm*.rs",
  "apps/root-task/src/drivers/sd*.rs",
  "apps/root-task/src/drivers/cyw43/**",
  "configs/root_task_pi4_uboot_aarch64.toml",
  "scripts/pi4*.py",
  "scripts/pi4*.sh",
  "u-boot/**",
]

[[convergence_focus]]
id = "worker"
targets = ["qemu"]
description = "Executable Worker construction, loading, capability, lifecycle, and recovery changes."
profile = "qemu_smp_production / configs/root_task.toml"
authoritative_evidence = "canonical QEMU boot, real Worker READY, and one bounded startup/teardown/restart recovery operation"
priority = 95
trigger_paths = [
  "apps/root-task/src/hal/worker_task.rs",
  "apps/root-task/src/userland/**",
  "apps/*worker*/**",
  "crates/*worker*/**",
  "scripts/worker_task_evidence.py",
]

[[convergence_focus]]
id = "ninedoor"
targets = ["qemu"]
description = "NineDoor isolation, IPC, passive MCS bootstrap, and service-runtime changes."
profile = "qemu_smp_production / configs/root_task.toml"
authoritative_evidence = "canonical QEMU boot, isolated NineDoor READY, and one real 9P operation"
priority = 90
trigger_paths = [
  "apps/root-task/src/ninedoor_service.rs",
  "apps/root-task/tests/ninedoor_service_isolation.rs",
  "apps/ninedoor*/**",
  "crates/ninedoor*/**",
]

[[convergence_focus]]
id = "console-network"
targets = ["qemu"]
description = "Isolated console service, ABI v5 SendBatch and CommandBatch, bounded synchronous response capture, direct data-plane boundaries, and live TCP transport changes."
profile = "qemu_smp_production / configs/root_task.toml"
authoritative_evidence = "canonical QEMU boot, isolated console READY v5, and the fixed one-socket HELP/NETSTATS/SMP/CACHELOG matrix"
priority = 90
trigger_paths = [
  "apps/console-network-runtime/**",
  "crates/console-network-abi/**",
  "apps/root-task/src/event/**",
  "apps/root-task/src/console_network_service.rs",
  "apps/root-task/src/hal/cache.rs",
  "apps/root-task/src/hal/console_network.rs",
  "apps/root-task/src/drivers/driver_task_net.rs",
  "apps/root-task/src/net/**",
  "apps/root-task/tests/console_network_service.rs",
  "apps/root-task/tests/direct_genet_network_phasing.rs",
  "scripts/qemu_tcp_response_matrix.py",
  "tests/test_qemu_tcp_response_matrix.py",
]

[[convergence_focus]]
id = "root-mcs"
targets = ["qemu"]
description = "Root-task MCS, IPC, capability, CSpace, scheduling, fault, SMP, image, and startup changes."
profile = "qemu_smp_production / configs/root_task.toml"
authoritative_evidence = "canonical QEMU boot, root steady state, one real target operation, and no unexpected seL4 fault"
priority = 80
trigger_paths = [
  "apps/root-task/**",
  "apps/*-runtime/**",
  "crates/sel4*/**",
  "configs/root_task.toml",
  "configs/sel4/**",
  "scripts/cohesix-build-run.sh",
]

[[convergence_focus]]
id = "live-transport"
targets = ["qemu", "pi4"]
description = "cohsh, TCP, REST, and gateway changes that require one live target transport operation."
profile = "selected target production profile"
authoritative_evidence = "one authenticated operation over the changed live target transport"
priority = 70
trigger_paths = [
  "apps/cohsh/**",
  "apps/coh/**",
  "apps/hive-gateway/**",
  "scripts/cohsh/**",
  "scripts/rest_*.py",
]

[[convergence_focus]]
id = "python-sdk"
targets = ["qemu", "pi4"]
description = "Host-only Python SDK and example changes."
profile = "host-only Python SDK"
authoritative_evidence = "focused Python SDK tests"
priority = 60
trigger_paths = ["tools/cohesix-py/**"]

[[convergence_focus]]
id = "swarmui"
targets = ["qemu", "pi4"]
description = "Host-only SwarmUI changes."
profile = "host-only SwarmUI"
authoritative_evidence = "focused SwarmUI package tests"
priority = 60
trigger_paths = ["apps/swarmui/**", "tools/swarmui-ui-tests/**"]

[[convergence_focus]]
id = "test-plan-tooling"
targets = ["qemu", "pi4"]
description = "Test-plan catalog, runner, selection, and evidence tooling changes."
profile = "test-plan tooling"
authoritative_evidence = "focused test-plan tooling tests and catalog/document consistency"
priority = 55
trigger_paths = [
  "configs/test_plan_actions.toml",
  "scripts/ci/test_plan*.py",
  "scripts/ci/test_plan*.sh",
  "scripts/ci/test_test_plan*.py",
  "scripts/ci/check_test_plan.sh",
]

[[convergence_focus]]
id = "docs"
targets = ["qemu", "pi4"]
description = "Documentation-only changes."
profile = "generated documentation contracts"
authoritative_evidence = "documentation metadata and generated-contract consistency"
priority = 10
trigger_paths = ["docs/**", "README.md", "AGENTS.md"]

[[action]]
id = "integrity.cargo-metadata"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Reject an unlocked or stale Cargo dependency resolution."
command = "cargo metadata --locked --no-deps"
timeout_seconds = 120
trigger_paths = ["Cargo.toml", "Cargo.lock", "**/Cargo.toml"]
expected_evidence = ["command-result"]
test_policy = "none"

[[action]]
id = "integrity.generated-contracts"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Validate generated artifacts and the test-plan catalog in one pass."
command = "scripts/check-generated.sh"
timeout_seconds = 600
trigger_paths = [
  "configs/**",
  "docs/**",
  "scripts/**",
  "tools/coh-rtc/**",
  "apps/root-task/src/generated/**",
]
expected_evidence = ["command-result"]
test_policy = "none"
convergence_focuses = [
  "root-mcs",
  "worker",
  "ninedoor",
  "console-network",
  "pi4-driver",
  "live-transport",
  "test-plan-tooling",
  "docs",
]
convergence_phase = "target-entry"

[[action]]
id = "host.format"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Fail fast on Rust formatting drift."
command = "cargo fmt --all -- --check"
timeout_seconds = 300
trigger_paths = ["**/*.rs", "**/Cargo.toml", "Cargo.toml"]
expected_evidence = ["command-result"]
test_policy = "none"

[[action]]
id = "host.clippy"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Lint every workspace target with warnings denied."
command = "CARGO_INCREMENTAL=0 cargo clippy --workspace --all-targets -- -D warnings"
timeout_seconds = 1800
trigger_paths = ["**/*.rs", "**/Cargo.toml", "Cargo.toml", "Cargo.lock"]
expected_evidence = ["command-result"]
test_policy = "none"

[[action]]
id = "host.workspace-check"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Type-check the default workspace configuration once."
command = "CARGO_INCREMENTAL=0 cargo check --workspace"
timeout_seconds = 1200
trigger_paths = ["**/*.rs", "**/Cargo.toml", "Cargo.toml", "Cargo.lock"]
expected_evidence = ["command-result"]
test_policy = "none"

[[action]]
id = "host.workspace-tests"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Run the default workspace test closure once; SwarmUI has its own complete suite."
command = "CARGO_INCREMENTAL=0 cargo test --workspace --exclude swarmui --exclude pi4-driver-runtime"
timeout_seconds = 3600
trigger_paths = ["**/*.rs", "**/Cargo.toml", "Cargo.toml", "Cargo.lock", "tests/**"]
expected_evidence = ["command-result", "nonzero-test-inventory"]
test_policy = "nonzero"
minimum_test_count = 1

[[action]]
id = "host.swarmui-tests"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Run the complete SwarmUI Rust package suite once."
command = "CARGO_INCREMENTAL=0 cargo test -p swarmui"
timeout_seconds = 1200
trigger_paths = ["apps/swarmui/**", "crates/**", "tests/fixtures/**"]
expected_evidence = ["command-result", "nonzero-test-inventory"]
test_policy = "nonzero"
minimum_test_count = 1
convergence_focuses = ["swarmui"]
convergence_phase = "focused-host"

[[action]]
id = "host.coh-mock-tests"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Run the complete coh mock-feature test suite once."
command = "cargo test -p coh --features mock"
timeout_seconds = 600
trigger_paths = ["apps/coh/**", "crates/**", "configs/**"]
expected_evidence = ["command-result", "nonzero-test-inventory"]
test_policy = "nonzero"
minimum_test_count = 1

[[action]]
id = "host.root-task-qemu-features"
stage = 1
tier = "common-hermetic"
scope = "common"
targets = ["qemu", "pi4"]
description = "Run the broad root-task QEMU production-feature library suite once, excluding the Pi-only linked driver-task module covered by the complete Pi suite."
command = "cargo test -p root-task --no-default-features --features driver-tests-qemu --lib -- --test-threads=1 --skip drivers::driver_task_net"
timeout_seconds = 2400
trigger_paths = ["apps/root-task/**", "crates/**", "configs/**"]
expected_evidence = ["command-result", "nonzero-test-inventory"]
test_policy = "nonzero"
minimum_test_count = 1

