[[action]]
id = "pi4.rest-regression"
stage = 4
tier = "pi4-transport"
scope = "target"
targets = ["pi4"]
description = "Run REST parity through a gateway bound to the same Pi 4 boot evidence."
command = "scripts/ci/test_plan_stage_04_rest_multiplexer.sh"
timeout_seconds = 3600
trigger_paths = ["apps/hive-gateway/**", "apps/coh/**", "apps/cohsh/**", "crates/cohesix-rest/**", "crates/net-constants/**", "scripts/ci/test_plan_stage_04_rest_multiplexer.sh", "scripts/ci/test_rest_regression_batch.py", "scripts/cohsh/**", "tools/cohesix-py/**"]
