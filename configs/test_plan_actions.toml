timeout_seconds = 1800
trigger_paths = ["apps/root-task/**", "apps/console-network-runtime/**", "apps/nine-door-runtime/**", "apps/pi4-driver-runtime/**", "apps/worker-*/**", "crates/console-network-abi/**", "crates/pi4-driver-abi/**", "crates/secure9p-transport/**", "crates/worker-task-abi/**", "configs/root_task_pi4_uboot_aarch64.toml", "configs/sel4/**", "configs/driver_runtime_classic_comparator.toml", "scripts/ci/test_plan_target_root_check.sh", "scripts/driver_runtime_manifest.py", "scripts/worker_image_manifest.py", "tools/coh-rtc/**", "seL4/build_UBOOT/**", "Cargo.lock"]
