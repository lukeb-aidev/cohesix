[[action]]
id = "target.root-task-pi4-release"
stage = 2
tier = "pi4-transport"
scope = "provisioned-target"
targets = ["pi4"]
description = "Fail closed unless the selected Pi 4 manifest matches the compiled generated root-task identity, then build fresh isolated components and compile the exact 54 MHz release feature set."
