[[action]]
id = "target.qemu-profile"
stage = 2
tier = "qemu-integration"
scope = "provisioned-target"
targets = ["qemu"]
description = "Validate the provisioned canonical QEMU seL4 profile."
command = "\"${TEST_PLAN_ROOT}/out/toolchain/sel4-profile-venv/bin/python\" scripts/sel4_profile.py validate --profile qemu_smp_production --build-dir \"${TEST_PLAN_ROOT}/out/sel4/profile-v2/qemu-smp-production\" --require-source --require-artifacts --for-runtime"
timeout_seconds = 600
trigger_paths = ["configs/sel4/**", "scripts/sel4_profile.py", "tools/sel4-profile-project/**"]
expected_evidence = ["command-result", "sel4-profile-identity"]
test_policy = "none"
convergence_focuses = [
  "root-mcs",
  "worker",
  "ninedoor",
  "console-network",
  "live-transport",
]
convergence_phase = "target-entry"

[[action]]
id = "target.root-task-qemu-release"
stage = 2
tier = "qemu-integration"
scope = "provisioned-target"
targets = ["qemu"]
description = "Verify that the selected QEMU manifest matches the compiled generated root-task identity, then build fresh isolated components and compile the exact 24 MHz release feature set."
command = "scripts/ci/test_plan_target_root_check.sh --target qemu --sel4-build \"${TEST_PLAN_ROOT}/out/sel4/profile-v2/qemu-smp-production\" --profile qemu_smp_production --features release-qemu --timer-clock-hz 24000000"
timeout_seconds = 1800
trigger_paths = ["apps/root-task/**", "apps/console-network-runtime/**", "apps/nine-door-runtime/**", "apps/pi4-driver-runtime/**", "apps/worker-*/**", "crates/console-network-abi/**", "crates/pi4-driver-abi/**", "crates/secure9p-transport/**", "crates/worker-task-abi/**", "configs/root_task.toml", "configs/sel4/**", "configs/driver_runtime_classic_comparator.toml", "scripts/ci/test_plan_target_root_check.sh", "scripts/driver_runtime_manifest.py", "scripts/worker_image_manifest.py", "tools/coh-rtc/**", "Cargo.lock"]
expected_evidence = ["command-result", "sel4-profile-identity"]
test_policy = "none"

[[action]]
id = "target.pi4-profile"
stage = 2
tier = "pi4-transport"
scope = "provisioned-target"
targets = ["pi4"]
description = "Validate the canonical repo-managed Pi 4 seL4 16 diagnostic profile."
command = "\"${TEST_PLAN_ROOT}/.venv/bin/python\" scripts/sel4_profile.py validate --repo-managed --profile pi4_diagnostic --build-dir \"${TEST_PLAN_ROOT}/seL4/build_UBOOT\" --require-artifacts --for-runtime"
timeout_seconds = 600
trigger_paths = ["configs/sel4/**", "scripts/sel4_profile.py", "seL4/build_UBOOT/**"]
expected_evidence = ["command-result", "sel4-profile-identity"]
test_policy = "none"
convergence_focuses = ["pi4-driver", "live-transport"]
