# Copy to a private file. Replace every path, hash, request and credential
# reference with the selected deployment; these zero hashes cannot pass live
# source and binary checks. Credential values never belong in this file.
schema = "cohesix-m28-live-reference/v1"
host_profile = "jetson-orin-nano-jp7"
