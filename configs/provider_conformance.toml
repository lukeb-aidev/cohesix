# Author: Lukas Bower
# Purpose: Select bounded provider contract checks and preserve separate native, executor, deployment and evidence proof lanes.
# Copyright 2026 Lukas Bower
schema = "cohesix-provider-conformance-matrix/v1"
registry = "configs/generated/provider_registry.json"
maximum_cases = 64
maximum_output_bytes = 1048576
maximum_case_seconds = 600

# Exact versions, auth/secret refs, lifecycle, native identity, evidence and
# deployment obligations are inherited from the generated registry. This file
# selects checks; it cannot add actions, change versions or promote availability.
profiles = ["jetson-orin-nano-jp7"]
required_lifecycle = ["discover", "preflight", "execute", "observe", "verify", "compensate", "export_evidence"]
proof_lanes = ["mock", "dry_run", "live_safe", "negative", "receipt", "recovery", "package"]

[[cases]]
id = "m28-jobs-live"
group = "executors"
providers = ["gpu.workload", "systemd"]
proof_class = "live_target"
lane = "live_safe"
runner = "provider_m28_live"

[[cases]]
id = "m28-authority-live"
group = "identity"
providers = ["gpu.workload", "systemd"]
proof_class = "live_target"
lane = "live_safe"
runner = "provider_m28_live"

[[cases]]
id = "native-identity-and-postcondition"
group = "executors"
providers = ["systemd", "docker", "k8s"]
proof_class = "host_contract"
lane = "negative"
command = ["cargo", "test", "--locked", "-p", "host-ticket-agent", "--lib", "executors::"]

[[cases]]
id = "federation-durable-terminal-return"
group = "executors"
providers = []
surface = "federation"
proof_class = "host_contract"
lane = "recovery"
command = ["cargo", "test", "--locked", "-p", "host-ticket-agent", "--lib", "relay::tests::"]

