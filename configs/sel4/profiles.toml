python_tool = "out/toolchain/sel4-profile-venv/bin/python"
evidence_class = "production"
target = "qemu"
default_build_dir = "out/sel4/profile-v2/qemu-smp-production"
release_eligible = true
runtime_eligible = true
source_policy = "clean"
memoization_cache = "disabled"
forbidden_cache_keys = ["KernelDomainSchedule"]
