cohesix_system_image = false
rwx_policy = "record-nonshipping-exception"
elf_machine = 183
elf_artifacts = ["kernel", "elfloader", "rootserver", "system_image"]
exception_id = "upstream-sel4test-rwx-load"
exception_reason = "Upstream seL4Test profile-validation ELFs are non-shipping inputs; Cohesix release-image W^X acceptance is a separate gate."

