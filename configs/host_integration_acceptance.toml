dependencies = ["gpu-receipt-path", "peft-receipt-path", "worker-control"]
target = "qemu"
expected_result = "fresh QEMU target rows may pass only with exact current-session identity"

[[conformance_vectors]]
id = "circular-dependency"
mutation = "make worker-control depend transitively on itself"
expected_error = "circular host-integration dependency"
[[conformance_vectors]]
id = "future-live"
mutation = "select a future provider as live"
expected_error = "future dependency is selectable as current/live"
[[conformance_vectors]]
id = "missing-owner"
mutation = "clear owner or select a nonexistent owning milestone"
expected_error = "unknown owning milestone"
[[conformance_vectors]]
id = "mode-substitution"
mutation = "use fixture mock or dry-run for a live-required row"
expected_error = "observed mode does not satisfy required mode"
[[conformance_vectors]]
id = "secret-evidence"
mutation = "include a credential value in observation evidence"
expected_error = "sensitive material"
[[conformance_vectors]]
id = "stale-target"
mutation = "bind a target session to a stale graph or manifest hash"
expected_error = "target session identity mismatch"
[[conformance_vectors]]
id = "unknown-reference"
mutation = "reference an unknown action path or schema"
expected_error = "unknown generated reference"
[[conformance_vectors]]
id = "worker-ready-substitution"
mutation = "treat provider or host readiness as Worker READY"
expected_error = "provider state cannot become Worker READY"
[[conformance_vectors]]
id = "wrong-target"
mutation = "submit a Pi target session to the QEMU lane"
expected_error = "wrong target"
