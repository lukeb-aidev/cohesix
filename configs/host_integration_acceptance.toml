# Registration declares requirements; it never attests a live provider.
[providers]
schema = "cohesix-provider-contract/v1"

# Read-only host security observations require no service, path or credential enrollment.
[[providers.macos_targets]]
id = "local-endpoint-compliance"
[providers.macos_targets.operation]
action = "endpoint_compliance.observe"

# Deployment enrollment replaces these disabled exact policies in compiler IR.
# Public JWKS bytes are pinned by SHA-256; no remote discovery or token URLs.
[[providers.identity_mappings]]
id = "enterprise"
kind = "oidc"
enabled = false
issuer = "https://identity.example.invalid"
audience = "cohesix"
algorithm = "RS256"
keyset_sha256 = []
maximum_ttl_s = 300
rules = []

