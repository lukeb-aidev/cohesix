recovery_actions = ["systemd.stop"]
external_dependencies = [{ id = "critical-infra-app", owner = "deployment-owner", kind = "signed_application" }]
worker_tier = "executable"
evidence_schema = "cohesix-causal-evidence/v1"
governance_mode = "observe"
authority_custodian = "root-admitted-ticket"
bypass_posture = "Native administrators remain independent; labels and package presence grant no Cohesix authority."
package_profile = "linux-aarch64-cuda"
stages = [
  { id = "preflight", after = [], owner = "controller", postcondition = "Resolve exact packages, external applications, native targets, topology and credential references before any write.", when = "normal" },
  { id = "admit", after = ["preflight"], owner = "target-hive", postcondition = "Authenticate the caller and admit one bounded ticket under current writer and policy authority.", when = "normal" },
  { id = "execute", after = ["admit"], owner = "provider-host", postcondition = "Dispatch only the admitted action through its registered native executor; dispatch alone is non-terminal.", when = "normal" },
  { id = "observe", after = ["execute"], owner = "provider-host", postcondition = "Read exact native object identity and postcondition, retaining bounded immutable artifacts.", when = "normal" },
  { id = "verify", after = ["observe"], owner = "controller", postcondition = "Validate every signed causal chain and exact target/Worker/native correlation before advancing.", when = "normal" },
  { id = "recover", after = ["verify"], owner = "controller", postcondition = "Submit a separately admitted recovery ticket linked to the verified original graph; stopping a service does not reverse publication or certify safety.", when = "explicit_recovery" },
]

