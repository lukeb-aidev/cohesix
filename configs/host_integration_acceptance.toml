dependencies = ["docker-provider", "federation-provider", "gpu-host-provider", "host-ticket-executor", "kubernetes-provider", "peft-host-provider", "sidecar-provider", "systemd-provider"]
expected_result = "provider-live obligations remain unsatisfied"

[[lanes]]
id = "fixture-contracts"
mode = "fixture"
dependencies = ["docker-provider", "gpu-host-provider", "host-ticket-executor", "kubernetes-provider", "peft-host-provider", "sidecar-provider", "systemd-provider"]
expected_result = "fixtures remain non-promoting"

[[lanes]]
id = "mock-contracts"
mode = "mock"
dependencies = ["docker-provider", "federation-provider", "gpu-host-provider", "host-ticket-executor", "kubernetes-provider", "peft-host-provider", "sidecar-provider", "systemd-provider"]
expected_result = "host models remain non-promoting"

[[lanes]]
id = "pi4-target-session"
mode = "live"
dependencies = ["gpu-receipt-path", "peft-receipt-path", "worker-control"]
target = "pi4"
expected_result = "fresh Pi target rows may pass only with exact current-session identity"

[[lanes]]
id = "qemu-target-session"
