[playbooks.workflow]
schema = "cohesix-workflow/v1"
topology = [{ id = "controller", owner = "coh-workflow", host_class = "linux" }, { id = "target-hive", owner = "root-task", host_class = "sel4" }, { id = "provider-host", owner = "host-ticket-agent", host_class = "jetson" }]
