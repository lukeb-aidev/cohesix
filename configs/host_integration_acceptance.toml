prefix = "/proc/version"
class = "public"
owner_binding = "none"

[[providers.read_visibility]]
prefix = "/proc/capabilities"
class = "public"
owner_binding = "none"

[[providers.read_visibility]]
prefix = "/worker"
class = "ticket_scoped"
owner_binding = "worker_subject"

[[providers.read_visibility]]
prefix = "/shard"
class = "ticket_scoped"
owner_binding = "worker_subject"

[[providers.read_visibility]]
prefix = "/gpu"
class = "ticket_scoped"
owner_binding = "explicit_scope"

[[providers.read_visibility]]
prefix = "/models"
class = "ticket_scoped"
owner_binding = "explicit_scope"

[providers.gpu_executor]
schema = "cohesix-gpu-local/v1"
transport = "unix_socket"
authentication = "hmac_sha256"
maximum_frame_bytes = 16384
maximum_jobs = 64
maximum_wal_bytes = 4194304
lease_heartbeat_ttl_ms = 1000
maximum_request_bytes = 8192
maximum_device_allocation_bytes = 67108864
maximum_streams = 1
maximum_runtime_ms = 30000
entrypoints = ["vadd", "matmul"]
profile = "jetson-orin-nano-jp7"

