credential_ref = "env:COHESIX_SIEM_TOKEN"
maximum_entries = 64
maximum_wal_bytes = 4194304
maximum_attempts = 5
timeout_ms = 5000
maximum_backoff_ms = 300000

[[providers.relay_credentials]]
