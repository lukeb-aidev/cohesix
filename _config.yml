# Author: Lukas Bower
# Purpose: Build the documentation with a repository-owned SwarmUI theme on every Pages publish.
# Copyright 2026 Lukas Bower

title: Cohesix
description: Documentation for the Cohesix edge AI control plane.
url: https://lukeb-aidev.github.io
baseurl: /cohesix
repository: lukeb-aidev/cohesix
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  parse_block_html: true

# GitHub's special contributor files also belong in the documentation site.
include:
  - CONTRIBUTING.md

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep generated local state and build dependencies out of the site.
exclude:
  - out
  - target
  - seL4
  - third_party
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - tools/swarmui-ui-tests/node_modules

  # Publication-only exclusions for unused pages; source and release archives stay in Git.
  - releases/Cohesix-1.0.0-beta-MacOS/
  - releases/Cohesix-1.0.0-beta-Pi4/
  - releases/Cohesix-1.0.0-beta-linux/
  - releases/Cohesix-1.1.0-beta-MacOS/
  - releases/Cohesix-1.1.0-beta-Pi4/
  - releases/Cohesix-1.1.0-beta-linux/
  - releases/Cohesix-1.2.0-MacOS/
  - releases/Cohesix-1.2.0-Pi4/
  - releases/Cohesix-1.2.0-linux/
  - apps/cohsh/src/manual.md
  - apps/gpu-bridge-host/README.md
  - apps/swarmui/frontend/index.html
  - apps/swarmui/reference/README.md
  - crates/boot/uefi-elfloader-shim/README.md
  - crates/sel4-sys/upstream/libsel4/README.md
  - demo/README.md
  - demo/peft_adapter/README.md
  - docs/NETWORK_CONFIG.md
  - docs/audit/AUDIT_REPORT_2026-02-14.md
  - docs/audit/BLOCKERS.md
  - docs/audit/CONTROL_TRACEABILITY.md
  - docs/audit/DUE_DILIGENCE_PLAN.md
  - docs/audit/M26D_MCS_DECISION.md
