# Author: Lukas Bower
# Purpose: Profile direct NeMo model responses on the same fixed questions as Cohesix-backed workflows.
# Copyright 2026 Lukas Bower
llms:
  agent_model:
    _type: openai
    model_name: ${NEMO_MODEL_NAME}
    base_url: ${NEMO_MODEL_BASE_URL}
    api_key: ${NEMO_MODEL_API_KEY}
    max_retries: 0
    request_timeout: 45
workflow:
  _type: chat_completion
  llm_name: agent_model
  system_prompt: "Answer only from information supplied in the prompt; state unknown for unobserved Cohesix jobs."
eval:
  general:
    dataset:
      _type: json
      file_path: ${NEMO_EVAL_DATASET}
    max_concurrency: 1
    per_input_user_id: false
    profiler:
      base_metrics: true
