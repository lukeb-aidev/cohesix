# Author: Lukas Bower
# Purpose: Define packaging and optional integrations for the Cohesix Python client.
# Copyright 2026 Lukas Bower

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesix"
version = "0.2.0-alpha2"
description = "Cohesix Python client (filesystem + TCP console backends)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/lukasbower/cohesix"

[project.optional-dependencies]
integrations = [
  "docker>=7.0.0",
  "kubernetes>=29.0.0",
  "nvidia-ml-py>=12.560.30",
]
ml = [
  "peft>=0.15.0",
  "transformers>=4.48.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
cohesix-playbook = "cohesix.playbook_cli:main"
