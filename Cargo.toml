# Author: Lukas Bower
# Purpose: Define the Cohesix workspace members and shared dependencies.
# Copyright 2026 Lukas Bower
# SPDX-License-Identifier: Apache-2.0
[workspace]
members = [
    "apps/cohesix-proto",
    "apps/console-ack-wire",
    "apps/coh",
    "apps/cohsh",
    "apps/coh-status",
    "apps/cas-tool",
    "apps/swarmui",
    "apps/root-task",
    "apps/pi4-driver-runtime",
    "apps/nine-door",
    "apps/nine-door-runtime",
    "apps/console-network-runtime",
    "apps/worker-heart",
    "apps/worker-gpu",
    "apps/worker-bus",
    "apps/worker-lora",
    "apps/sidecar-bus",
    "apps/gpu-bridge-host",
    "apps/host-sidecar-bridge",
    "apps/host-ticket-agent",
    "apps/hive-gateway",
    "crates/cargo-build-directive",
    "crates/cohesix-cas",
    "crates/cohesix-rest",
    "crates/cohesix-ticket",
    "crates/cohesix-worker-evidence",
    "crates/cohsh-core",
    "crates/pi4-driver-abi",
    "crates/worker-task-abi",
    "crates/console-network-abi",
    "crates/host-cuda",
    "crates/secure9p-codec",
    "crates/secure9p-core",
    "crates/secure9p-transport",
    "crates/boot/uefi-elfloader-shim",
    "crates/trace-model",
    "crates/sel4-panicking",
    "crates/sel4-runtime",
    "crates/sel4-sys",
    "crates/net-constants",
    "tools/coh-rtc",
    "tools/rust-risk-audit",
    "tools/security-nist",
    "tests",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
incremental = false
strip = "debuginfo"
split-debuginfo = "off"

# The isolated packet path must minimize CPU spent inside its fixed MCS
# reservations. Keep the release artifact/profile identity and all safety
# settings; image construction still enforces each declared ELF/page bound.
[profile.release.package.root-task]
opt-level = 3

[profile.release.package.console-network-runtime]
opt-level = 3

[profile.release.package.pi4-driver-runtime]
opt-level = "s"

[profile.release.package.smoltcp]
opt-level = 3

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
cargo-build-directive = { path = "crates/cargo-build-directive" }
cohesix-ticket = { path = "crates/cohesix-ticket" }
cohsh-core = { path = "crates/cohsh-core" }
secure9p-codec = { path = "crates/secure9p-codec" }
secure9p-core = { path = "crates/secure9p-core" }
secure9p-transport = { path = "crates/secure9p-transport" }
anyhow = "1.0.104"
thiserror = { version = "2.0.19", default-features = false }
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
base64 = { version = "0.23.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
rand = "0.10.2"
cohesix-net-constants = { path = "crates/net-constants" }
cohesix-proto = { path = "apps/cohesix-proto" }
console-ack-wire = { path = "apps/console-ack-wire" }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
signature = { version = "3.0.0", default-features = false }
cohesix-cas = { path = "crates/cohesix-cas" }
cohesix-worker-evidence = { path = "crates/cohesix-worker-evidence" }
pi4-driver-abi = { path = "crates/pi4-driver-abi" }
worker-task-abi = { path = "crates/worker-task-abi" }
console-network-abi = { path = "crates/console-network-abi" }

[patch.crates-io]
sel4-sys = { path = "crates/sel4-sys" }
