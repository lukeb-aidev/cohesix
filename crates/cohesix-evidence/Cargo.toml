[package]
name = "cohesix-evidence"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
cohesix-authority = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
fs2 = "0.4.3"
libc = "0.2"
rustix = { version = "1", features = ["process"] }
tempfile = "3.27.0"

[dev-dependencies]
