# Author: Lukas Bower
# Purpose: Provide a small REST client for the Cohesix hive-gateway.
# Copyright 2026 Lukas Bower
[package]
name = "cohesix-rest"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cohesix hive-gateway REST client"

[dependencies]
cohesix-authority = { workspace = true, features = ["std"] }
cohesix-ticket = { workspace = true }
cohsh-core = { workspace = true }
anyhow = { workspace = true }
cohesix-net-constants = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.27.0"
